[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "share-causal-uncertainty"
version = "0.1.0"
description = "Identification-aware causal sensitivity benchmarking and SHARE observational diagnostics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.25", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.3", "networkx>=3.2", "matplotlib>=3.8", "statsmodels>=0.14", "pydantic>=2.5", "httpx>=0.26", "PyYAML>=6.0"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.0"]
[project.scripts]
sharecausal = "sharecausal.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
